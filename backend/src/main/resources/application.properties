spring.application.name=sebastian-backend
server.port=${BACKEND_PORT}

# Data source. APP_DATABASE_URL is a native Postgres URL (postgresql://...)
# WITHOUT credentials -- the JDBC driver parses user@host as a hostname, so creds
# come from DATABASE_USER/DATABASE_PW. The app prepends jdbc: here.
# (sqlx/psql use DATABASE_URL, which may embed credentials.)
spring.datasource.url=jdbc:${APP_DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PW}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate. Schema is managed by sqlx migrations, so ddl-auto is none.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
# Disable Open Session In View: lazy collections must be accessed within an explicit @Transactional
# boundary. This removes the hidden performance footgun of DB connections held open across the
# full HTTP request lifecycle, and ensures fulfillment code is tested without OSIV as a crutch.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DEFAULT_SCHEMA}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PW}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Actuator / observability
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.observations.enable.http.server.requests=true
app.otel-collector-url=http://localhost:4318
